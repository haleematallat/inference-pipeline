[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-pipeline"
version = "0.1.0"
description = "Configurable computer-vision inference pipeline with a local PyTorch few-shot backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2.3",
    "pillow>=10",
    "pydantic>=2.6,<3",
    "pyyaml>=6",
    "torch>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "types-PyYAML>=6",
]
redis = ["redis>=5"]
triton = ["tritonclient[grpc]>=2.45"]
vision = ["torchvision>=0.17"]

[project.scripts]
vision-pipeline = "vision_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
files = ["src/vision_pipeline"]
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
