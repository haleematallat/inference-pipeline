seed: 7
logging_level: INFO

stream:
  type: local_file
  input_dir: ../examples/query
  output_path: ../outputs/predictions.jsonl
  capacity: 16

runners:
  - type: few_shot_classifier
    name: demo-few-shot
    backend:
      type: local_pytorch
      device: cpu
      batch_size: 4
      support_dir: ../examples/support
      similarity_metric: cosine
      top_k: 2
      rejection_threshold: 0.75
      encoder:
        type: statistical
        name: statistical
        pretrained: false
      preprocessing:
        size: [32, 32]
        normalize: false
